# Port to listen on (use 0 for a random free port)
server.port=8080
# Size of the worker thread pool
server.threads=8
# Folder with static files (relative to where you run the server)
server.publicDir=public
# Max requests per client IP per minute (0 = unlimited)
server.rateLimitPerMinute=120
# Socket read timeout in milliseconds
server.readTimeoutMillis=5000
