<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core Java HTTP Server</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Core Java HTTP Server</h1>
    <p>Built from scratch with only the JDK: sockets, a thread pool, and a hand-written HTTP parser.</p>

    <section>
      <h2>Try the API</h2>
      <input id="name" placeholder="Your name" value="Keerthan">
      <button id="hello">GET /api/hello</button>
      <button id="stats">GET /api/stats</button>
      <button id="echo">POST /api/echo</button>
      <pre id="out">Click a button...</pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
